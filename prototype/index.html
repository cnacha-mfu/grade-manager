<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADT Grade Manager — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --fg: #1f2328; --muted: #646b75; --line: #e4e0da;
    --accent: #9b3b2f; --accent-2: #7a2e25; --accent-soft: #f7e9e6;
    --ok: #1f7a4d; --ok-soft: #e3f3ea; --warn: #9a6400; --warn-soft: #fbf0d9;
    --err: #b42318; --err-soft: #fde7e5; --info: #2457a6; --info-soft: #e5eefb;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14.5px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .demo-banner { background: #2b2f36; color: #e8e8e8; font-size: 12.5px; padding: 6px 16px; text-align: center; }
  .demo-banner b { color: #fff; }
  header.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .top-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .brand .dot { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .roles { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; flex-wrap: wrap; }
  .roles button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .roles button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
  .who { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .who b { color: var(--fg); font-weight: 600; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; }
  .stack > * + * { margin-top: 14px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: #cfc9c1; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.big { padding: 11px 20px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .chip.notsub { background: #eceae6; color: #555; }
  .chip.buddy { background: var(--info-soft); color: var(--info); }
  .chip.program { background: #efe6fa; color: #6a3aa8; }
  .chip.returned { background: var(--warn-soft); color: var(--warn); }
  .chip.approved { background: var(--ok-soft); color: var(--ok); }
  .chip.err { background: var(--err-soft); color: var(--err); }
  .chip.muted { background: #eceae6; color: #666; font-weight: 500; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .summary .card { padding: 12px 14px; }
  .summary .n { font-size: 24px; font-weight: 700; }
  .summary .l { color: var(--muted); font-size: 12.5px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .filters button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
  .search { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-width: 240px; background: var(--card); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
  tr.clickable:hover td { background: #faf8f5; cursor: pointer; }
  .code { font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .hint { background: var(--info-soft); color: #1d3f78; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
  .hint.warn { background: var(--warn-soft); color: #6f4900; }
  .hint.err { background: var(--err-soft); color: #8a1b13; }
  .hint.ok { background: var(--ok-soft); color: #135a37; }
  /* wizard */
  .steps { display: flex; gap: 0; margin: 6px 0 18px; flex-wrap: wrap; }
  .steps .s { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: var(--muted); font-size: 13px; border-bottom: 3px solid var(--line); }
  .steps .s .num { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .steps .s.done { color: var(--ok); border-color: var(--ok); }
  .steps .s.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
  .steps .s.cur { color: var(--fg); font-weight: 600; border-color: var(--accent); }
  .steps .s.cur .num { border-color: var(--accent); color: var(--accent); }
  .wiz-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .drop { border: 2px dashed #cfc7bd; border-radius: 12px; padding: 26px; text-align: center; background: #fcfbf9; transition: .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .big { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .file .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .paste { border: 2px dashed #cfc7bd; border-radius: 12px; min-height: 180px; display: grid; place-items: center; text-align: center; padding: 14px; background: #fcfbf9; cursor: pointer; outline: none; }
  .paste.active { border-color: var(--accent); background: var(--accent-soft); }
  .paste.filled { border-style: solid; border-color: var(--ok); background: #fff; padding: 6px; }
  .paste img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; }
  .guide { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); }
  .guide ol { margin: 6px 0 10px; padding-left: 20px; }
  .guide li { margin: 4px 0; }
  kbd { background: #f0ede8; border: 1px solid #d9d3cb; border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-size: 12.5px; font-family: inherit; font-weight: 600; }
  .sample { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .sample img { width: 100%; display: block; }
  .sample .tag { position: absolute; top: 6px; left: 6px; background: var(--ok); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .mark { position: absolute; border: 3px solid #f0a500; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,0); pointer-events: none; }
  .donts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .dont { border: 1px solid var(--err-soft); background: #fff8f7; border-radius: 8px; padding: 8px; font-size: 12px; color: #8a1b13; }
  .dont b { display: block; margin-bottom: 2px; }
  .problem { border: 1px solid var(--line); border-left: 4px solid var(--err); border-radius: 10px; padding: 14px; background: var(--card); }
  .problem.warn { border-left-color: #e0a100; }
  .problem.done { border-left-color: var(--ok); opacity: .8; }
  .problem .t { font-weight: 600; margin-bottom: 4px; }
  .q { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 6px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--fg); color: #fff; }
  .seg button.on.v { background: var(--ok); }
  .seg button.on.i { background: var(--err); }
  .seg button.on.n { background: #6b7280; }
  input[type=date], input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--card); }
  textarea { width: 100%; min-height: 60px; }
  .paperlist { display: grid; gap: 8px; }
  .paperlist .p { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .layout-review { display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 16px; align-items: start; }
  .panel { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
  .panel img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  .ticks label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
  .mini { font-size: 12.5px; border-collapse: collapse; width: 100%; }
  .mini td, .mini th { padding: 4px 8px; border: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .v-auto { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
  .issue-note { margin-top: 6px; }
  .issue-note input { width: 100%; border-color: var(--err); }
  .verdict-read { font-size: 13px; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { padding: 6px 0 6px 18px; border-left: 2px solid var(--line); position: relative; font-size: 13.5px; }
  .timeline li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); position: absolute; left: -5px; top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 90px; }
  .bars .b { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; opacity: .85; }
  .bars .b span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .bars-l { display: flex; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .bars-l div { flex: 1; text-align: center; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tabs button.on { color: var(--fg); border-color: var(--accent); }
  .toggle { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #d6d1ca; border: 0; cursor: pointer; flex: none; }
  .toggle::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: .15s; }
  .toggle.on { background: var(--ok); }
  .toggle.on::after { left: 19px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #22262c; color: #fff; padding: 11px 18px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 14px; z-index: 50; max-width: 90vw; }
  .back { display: inline-flex; gap: 6px; align-items: center; margin-bottom: 10px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; }
  .back:hover { color: var(--fg); }
  .pill-count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; text-align: center; margin-left: 4px; }
  @media (max-width: 980px) {
    .layout-review { grid-template-columns: 1fr; }
    .panel { position: static; max-height: none; }
    .shots, .grid2, .grid3 { grid-template-columns: 1fr; }
    .who { margin-left: 0; width: 100%; }
    .donts { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 1fr; }
  }

  /* ---- attention design ---- */
  .ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
  .ic.lg { width: 22px; height: 22px; }
  .art { width: 124px; height: 88px; flex: none; }
  .notice { display: flex; gap: 16px; align-items: center; border-radius: 14px; padding: 12px 18px; border: 1px solid var(--line); background: var(--card); }
  .notice.warn { background: #fff8e8; border-color: #f0d9a8; }
  .notice.brand { background: var(--accent-soft); border-color: #eccdc7; }
  .notice.ok { background: var(--ok-soft); border-color: #bfe3cf; }
  .notice h3 { margin: 0 0 2px; }
  .headsup { display: grid; gap: 8px; margin-bottom: 14px; }
  .headsup .h { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: #fff8e8; border: 1px solid #f0d9a8; color: #5c3d00; }
  .headsup .h.red { background: var(--err-soft); border-color: #f5c2bd; color: #7a1a12; }
  .headsup .h .ic { color: inherit; margin-top: 1px; }
  .progress { height: 8px; border-radius: 999px; background: #ebe7e1; overflow: hidden; }
  .progress > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .25s; }
  .jcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); display: grid; grid-template-columns: 42px 1fr; gap: 12px; }
  .jcard + .jcard { margin-top: 10px; }
  .jcard.attn { border-color: #f0c36d; box-shadow: 0 0 0 3px #fff1d6; }
  .jcard.done { border-color: #bfe3cf; }
  .jcard.bad { border-color: #f5c2bd; }
  .jcard .jic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .jcard.done .jic { background: var(--ok-soft); color: var(--ok); }
  .jcard.bad .jic { background: var(--err-soft); color: var(--err); }
  .jcard .jt { font-weight: 600; }
  .attn-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; font-weight: 700; color: #8a5a00; background: #ffe9b8; border-radius: 999px; padding: 1px 8px; margin-left: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .lockmsg { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .seg button:disabled { opacity: .38; cursor: not-allowed; }
  .eyebtn { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
  .eyebtn.seen { border-color: #9fd3b6; color: var(--ok); background: var(--ok-soft); }
  .eyebtn.need { border-color: var(--accent); color: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(155,59,47,.35); } 50% { box-shadow: 0 0 0 6px rgba(155,59,47,0); } }
  @media (prefers-reduced-motion: reduce) { .eyebtn.need { animation: none; } }
  .group-h { display: flex; gap: 10px; align-items: center; margin: 20px 0 10px; }
  .group-h h3 { margin: 0; }
  .group-h .ic { color: var(--muted); }
  .spot { border: 2px dashed #e0a100; background: #fffaf0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .autolist { display: grid; gap: 4px; }
  .autolist .a { display: flex; gap: 10px; align-items: center; padding: 6px 4px; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .autolist .a .ic { color: var(--ok); }
  .modal-bg { position: fixed; inset: 0; background: rgba(20,22,26,.5); display: grid; place-items: center; z-index: 60; padding: 16px; }
  .modal { background: var(--card); border-radius: 18px; max-width: 580px; width: 100%; padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); max-height: calc(100vh - 32px); overflow: auto; }
  .modal .mh { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .modal h2 { font-size: 20px; margin: 0 0 4px; }
  .recap { display: grid; gap: 8px; margin: 14px 0 18px; }
  .recap .r { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--bg); }
  .recap .r.good .ic { color: var(--ok); } .recap .r.warn { background: #fff8e8; } .recap .r.warn .ic { color: #b07800; } .recap .r.bad { background: var(--err-soft); } .recap .r.bad .ic { color: var(--err); }
  .hold { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; display: inline-flex; gap: 8px; align-items: center; }
  .hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.3); pointer-events: none; }
  .hold span { position: relative; }
  .hold-hint { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; }
  .slots { display: inline-flex; gap: 4px; vertical-align: middle; }
  .slot { width: 22px; height: 28px; border: 1.5px dashed #bdb6ad; border-radius: 4px; display: grid; place-items: center; color: #bdb6ad; }
  .slot .ic { width: 14px; height: 14px; }
  .slot.on { border: 1.5px solid var(--ok); background: var(--ok-soft); color: var(--ok); }
  .lookbox { border: 2px solid #f0c36d; background: #fffaf0; border-radius: 12px; padding: 10px 14px; }
  .lookbox b.t { display: block; color: #6f4900; margin-bottom: 4px; }
  .notice > div { font-weight: 400; }
  .zoomable { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; background: rgba(15,17,20,.85); z-index: 80; display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .lightbox .cap { position: fixed; top: 14px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
  .lookbox label, .ticks label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .gt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
  .gt input { width: 90px; }
  .unlocked { color: var(--ok); font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .quote { border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--bg); border-radius: 0 8px 8px 0; margin: 6px 0; }
</style>
</head>
<body>
<div class="demo-banner"><b>Prototype</b>: sample data only. Nothing is saved, and the names and student IDs are made up. Use the role buttons to switch between users. <a href="../" style="color:#9cc3ff">Read the PRD</a></div>
<header class="top"><div class="top-inner" id="top"></div></header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ------------------------------------------------------------------ data */
const PEOPLE = {
  anan:   { name: 'Dr. Anan Sukjai',          program: 'SE' },
  busaba: { name: 'Dr. Busaba Kaewta',        program: 'SE' },
  chai:   { name: 'Asst. Prof. Chai Rattana', program: 'SE', chair: true },
  nok:    { name: 'Dr. Nok Siriwan',          program: 'SE' },
  pim:    { name: 'Dr. Pim Wongsa',           program: 'MM' },
  krit:   { name: 'Dr. Krit Thongdee',        program: 'CE' },
  ploy:   { name: 'Dr. Ploy Chanthra',        program: 'DB' },
  dara:   { name: 'Khun Dara',                role: 'Secretary' },
  ekk:    { name: 'Khun Ekkachai',            role: 'Academic office' },
};
const PROGRAMS = { SE: 'Software Engineering', MM: 'Multimedia Technology & Animation', CE: 'Computer Engineering', DB: 'Digital Business' };
const ROLES = [
  { id: 'lecturer',  label: 'Lecturer',         user: 'anan' },
  { id: 'buddy',     label: 'Buddy reviewer',   user: 'busaba' },
  { id: 'program',   label: 'Program reviewer', user: 'chai' },
  { id: 'secretary', label: 'Secretary',        user: 'dara' },
  { id: 'office',    label: 'Office',           user: 'ekk' },

  if (s.status === 'notsub') return '<span class="muted small">—</span>';
  const n = paperNeeds(s), got = n.filter(p => p.st === 'received').length;

  if (b === 'issue' || p === 'issue') return '<span class="chip err">REG 100%: issue</span>';
  if (p === 'verified') return '<span class="chip approved">REG 100%: confirmed</span>';

}

/* ------------------------------------------------------------------ returned (lecturer) */
function renderReturned(s) {
  const open = s.issues.filter(i => i.open);
  return `${courseHead(s)}
    <div class="notice warn" style="margin-bottom:14px">${ART.returned}<div><h3>Returned with ${open.length} issue${open.length === 1 ? '' : 's'} to fix</h3>
      <div>From the ${s.returnedBy === 1 ? 'buddy, ' + esc(pname(s.buddy)) : 'program'}. Fix each one, then resubmit. It goes back to the ${s.returnedBy === 1 ? 'buddy' : 'program'}, who re-checks only what changed.</div></div></div>
    <div class="card stack">
      ${s.issues.map(i => `<div class="problem ${i.open ? '' : 'done'}"><div class="t row" style="gap:8px">${i.open ? ic('alert') : ic('check')} ${esc(ITEMS.find(x => x.id === i.item).label)}</div>
        <div class="row" style="gap:10px;align-items:flex-start">${avatar(i.by)}<div class="quote grow">"${esc(i.text)}"<div class="small muted">${esc(pname(i.by))}</div></div></div>
        ${i.open ? `<div class="row" style="margin-top:10px"><button class="btn primary" data-a="fixissue" data-v="${i.id}">I fixed it in REG. Upload the new file</button><button class="btn" data-a="replyissue" data-v="${i.id}">Explain instead</button></div>` : '<div class="small" style="color:var(--ok);margin-top:6px">Fixed. The reviewer will re-check this item.</div>'}
      </div>`).join('')}
      <div class="wiz-foot"><div></div><button class="btn primary big" data-a="resubmit" ${open.length ? 'disabled' : ''}>Resubmit →</button></div>
    </div>`;
}

/* ------------------------------------------------------------------ review (buddy = 1, program = 2) */
const JICON = { reg100: 'percent', missing: 'user', policy: 'clipboard', align: 'clipboard', ack: 'alert' };
const RTICKS = ['Every row in A says <b>Show</b>', 'The names and % in A match the score summary', 'The method in B matches TQF3', 'The cutoffs in B match TQF3 and the grade report'];
function rkey(s, round) { return s.id + ':' + round; }
function spotItem(s, round) { const autos = itemsFor(s).filter(i => i.type === 'auto'); return autos[(hash(s.id) + round * 3) % autos.length]; }
function unlockState(s, round, id) {
  const k = rkey(s, round), seen = (S.seen[k] || {})[id];
  if (id !== 'reg100') return { ok: !!seen, why: seen ? '' : 'Open the evidence to unlock ✓ Verified' };
  const ticks = S.rticks[k] || [], gt = (S.gt[k] || '').trim();
  const ticked = RTICKS.every((_, i) => ticks[i]);
  if (!seen) return { ok: false, why: 'Open the screenshots to unlock ✓ Verified' };
  if (gt === '') return { ok: false, why: 'Type the Grand Total % you see in screenshot A' };
  if (parseFloat(gt) !== 100) return { ok: false, why: `You read ${esc(gt)}%, which isn't 100%. Mark it as an Issue.`, bad: true };
  if (!ticked) return { ok: false, why: 'Tick the 4 checks beside the screenshots' };
  return { ok: true, why: '' };
}
function attention(s, round, i) {
  const a = s.answers, b = s.bv[i.id] || {};
  if (i.id === 'ack') return 'Lecturer overrode a warning';
  if (['missing', 'policy', 'align'].includes(i.id) && a[i.id] === 'No') return 'Lecturer answered No';
  if (i.id === 'align' && a.alignReason) return 'Differs from TQF3';
  if (round === 2 && b.v === 'issue') return 'Buddy raised an issue';
  if (round === 2 && b.v === 'na') return 'Buddy marked N/A';
  return '';
}
function headsUp(s, round) {
  const h = [];
  if (s.ack) h.push(['alert', 'The lecturer <b>overrode a warning</b>: ' + esc(s.ack), '']);
  if (!s.hasFinal && s.mCount) h.push(['alert', `<b>${s.mCount} M grades</b> in a course with <b>no final exam</b>. M is only for final-exam absence.`, 'red']);
  if (s.mCount && s.hasFinal) h.push(['doc', `<b>${s.mCount} M grade${s.mCount > 1 ? 's' : ''}</b>, so ${s.mCount} absence form${s.mCount > 1 ? 's' : ''} should reach the secretary.`, '']);
  if (s.answers.align === 'No') h.push(['clipboard', 'The lecturer says the score summary <b>differs from TQF3</b>. Read their reason.', '']);
  if (round === 2 && !paperDone(s)) h.push(['doc', `Paper documents <b>not all received</b> yet (${paperNeeds(s).filter(p => p.st === 'received').length}/${paperNeeds(s).length}). You can review now, but not approve.`, '']);
  return h.length ? `<div class="headsup">${h.map(([i, t, c]) => `<div class="h ${c}">${ic(i)}<div>${t}</div></div>`).join('')}</div>` : '';
}
function segFor(s, round, id, cur, lock) {
  return `<div class="seg">
    <button class="v ${cur.v === 'verified' ? 'on' : ''}" data-a="verdict" data-k="${id}" data-v="verified" ${lock.ok ? '' : 'disabled'}>✓ Verified</button>
    <button class="i ${cur.v === 'issue' ? 'on' : ''}" data-a="verdict" data-k="${id}" data-v="issue">✗ Issue</button>
    <button class="n ${cur.v === 'na' ? 'on' : ''}" data-a="verdict" data-k="${id}" data-v="na" ${lock.ok ? '' : 'disabled'}>N/A</button></div>`;
}
function reviewStats(s, round) {
  const mine = round === 1 ? s.bv : s.pv, items = itemsFor(s), spot = spotItem(s, round);
  const judge = items.filter(i => i.type === 'judge');
  const autos = items.filter(i => i.type === 'auto' && i.id !== spot.id);
  const decided = x => mine[x.id] && mine[x.id].v;
  const need = [...judge, spot, ...(round === 2 ? autos : [])];
  const done = need.filter(x => decided(x) && !(x.id === spot.id && mine[x.id].auto));
  const issues = items.filter(i => i.type !== 'paper' && (mine[i.id] || {}).v === 'issue');
  return { mine, judge, autos, spot, need, done, issues, noNote: issues.filter(i => !(mine[i.id].note || '').trim()) };
}
function renderReview(s, round) {
  const st = reviewStats(s, round), { mine, judge, autos, spot } = st, k = rkey(s, round);
  const paperOk = paperDone(s);
  const allDone = st.done.length === st.need.length;
  const canPass = allDone && !st.issues.length && (round === 1 || paperOk);
  let block = '';
  if (!allDone) block = `${st.need.length - st.done.length} check${st.need.length - st.done.length > 1 ? 's' : ''} left`;
  else if (st.issues.length) block = 'There are issues, so you can only return it';
  else if (round === 2 && !paperOk) block = 'Waiting for the secretary to receive the paper';
  const sorted = [...judge].sort((a, b) => (attention(s, round, b) ? 1 : 0) - (attention(s, round, a) ? 1 : 0));
  const card = (i) => {
    const cur = mine[i.id] || {}, lock = unlockState(s, round, i.id), attn = attention(s, round, i), b = s.bv[i.id] || {};
    const seen = (S.seen[k] || {})[i.id];
    const state = cur.v === 'verified' || cur.v === 'na' ? 'done' : cur.v === 'issue' ? 'bad' : '';
    return `<div class="jcard ${state} ${attn && !state ? 'attn' : ''}">
      <div class="jic">${ic(state === 'done' ? 'check' : state === 'bad' ? 'x' : JICON[i.id] || 'clipboard', 'lg')}</div>
      <div>
        <div class="jt">${i.label} ${i.no !== '—' ? `<span class="small muted">#${i.no}</span>` : ''}${attn ? `<span class="attn-tag">${ic('alert')} ${attn}</span>` : ''}</div>
        <div class="small" style="margin:3px 0 8px">${answerText(s, i)}</div>
        ${round === 2 ? `<div class="small" style="margin-bottom:8px">Buddy: ${b.v === 'verified' ? '<span class="chip approved">✓ Verified</span>' : b.v === 'issue' ? '<span class="chip err">✗ Issue</span>' : b.v === 'na' ? '<span class="chip muted">N/A</span>' : '—'} ${b.note ? `<span class="muted">"${esc(b.note)}"</span>` : ''}</div>` : ''}
        <div class="row">
          <button class="eyebtn ${seen ? 'seen' : 'need'}" data-a="panel" data-v="${i.id}">${ic('eye')} ${seen ? 'Evidence opened' : 'Open evidence'}</button>
          ${segFor(s, round, i.id, cur, lock)}
          ${!lock.ok && cur.v !== 'issue' ? `<span class="lockmsg" style="${lock.bad ? 'color:var(--err)' : ''}">${ic('lock')} ${lock.why}</span>` : ''}
        </div>
        ${cur.v === 'issue' ? `<div class="issue-note"><input type="text" placeholder="What should the lecturer fix? (required)" data-a="note" data-k="${i.id}" value="${esc(cur.note || '')}"></div>` : ''}
      </div></div>`;
  };
  const sp = mine[spot.id] || {}, spLock = unlockState(s, round, spot.id);
  const spotDone = sp.v && !sp.auto;
  const pct = Math.round(st.done.length / st.need.length * 100);
  return `${courseHead(s, round === 1 ? 'buddy review, requested by ' + esc(lecNames(s)) : 'program review')}
    ${headsUp(s, round)}
    <div class="layout-review">
      <div class="card">
        <div class="row" style="margin-bottom:6px"><h2 class="grow" style="margin:0">${round === 1 ? 'Buddy review' : 'Program review'}</h2><span class="small muted">${st.done.length} of ${st.need.length} checks done</span></div>
        <div class="progress" style="margin-bottom:6px"><div style="width:${pct}%"></div></div>
        <div class="small muted">${round === 1 ? 'Open each piece of evidence before you verify it. "Verified" stays locked until you do.' : "Check the buddy's work. You decide the judgment items and one spot-check yourself."}</div>

        <div class="group-h">${ic('eye', 'lg')}<h3>Needs your judgment (${judge.length})</h3></div>
        ${sorted.map(card).join('')}

        <div class="group-h">${ic('cpu', 'lg')}<h3>Pre-checked by the system (${autos.length + 1})</h3></div>
        <div class="spot">
          <div class="row" style="gap:8px;margin-bottom:6px">${ic('dice', 'lg')}<b>Random spot-check:</b> the system picked <b>${spot.label}</b> for you to look at yourself.</div>
          <div class="small" style="margin-bottom:8px">${answerText(s, spot)}</div>
          <div class="row">
            <button class="eyebtn ${(S.seen[k] || {})[spot.id] ? 'seen' : 'need'}" data-a="panel" data-v="${spot.id}">${ic('eye')} ${(S.seen[k] || {})[spot.id] ? 'Evidence opened' : 'Open evidence'}</button>
            ${segFor(s, round, spot.id, spotDone ? sp : {}, spLock)}
            ${!spLock.ok ? `<span class="lockmsg">${ic('lock')} ${spLock.why}</span>` : ''}
          </div>
          ${sp.v === 'issue' ? `<div class="issue-note"><input type="text" placeholder="What should the lecturer fix? (required)" data-a="note" data-k="${spot.id}" value="${esc(sp.note || '')}"></div>` : ''}
        </div>
        ${round === 2 ? `<div class="row" style="margin-bottom:8px"><button class="btn small" data-a="confirmrest" ${spotDone ? '' : 'disabled'}>✓ Confirm the other ${autos.length} pre-checked items</button>${spotDone ? '' : `<span class="lockmsg">${ic('lock')} Do the spot-check first</span>`}</div>` : ''}
        <button class="linkbtn small" data-a="showauto">${S.showAuto[k] ? 'Hide' : 'Show'} the other ${autos.length} items</button>
        ${S.showAuto[k] ? `<div class="autolist" style="margin-top:8px">${autos.map(i => { const c = mine[i.id] || {}; return `<div class="a">${c.v === 'issue' ? ic('x') : ic('check')}<div class="grow"><b>${i.label}</b><div class="small muted">${answerText(s, i)}</div></div>
          <button class="btn small ghost" data-a="${c.v === 'issue' ? 'unflag' : 'flag'}" data-v="${i.id}">${c.v === 'issue' ? 'Undo issue' : 'Flag an issue'}</button></div>
          ${c.v === 'issue' ? `<div class="issue-note"><input type="text" placeholder="What should the lecturer fix? (required)" data-a="note" data-k="${i.id}" value="${esc(c.note || '')}"></div>` : ''}`; }).join('')}</div>` : ''}

        <div class="group-h">${ic('doc', 'lg')}<h3>Paper documents (checked by the secretary)</h3></div>
        <div class="paperlist">${itemsFor(s).filter(i => i.type === 'paper').map(i => { const p = paperStatusText(s, i); return `<div class="p">${ic('doc')}<div class="grow">${i.label}</div>${p.v === 'ok' ? `<span class="chip approved">✓ ${p.text}</span>` : p.v === 'na' ? `<span class="chip muted">${p.text}</span>` : p.v === 'missing' ? `<span class="chip err">${p.text}</span>` : `<span class="chip muted">⏳ ${p.text}</span>`}</div>`; }).join('')}</div>

        <div class="wiz-foot">
          <button class="btn" data-a="return" ${st.issues.length && !st.noNote.length ? '' : 'disabled'}>${ic('undo')} Return to lecturer${st.issues.length ? ` (${st.issues.length})` : ''}</button>
          <div class="row">${block ? `<span class="small muted">${block}</span>` : ''}<button class="btn primary big" data-a="pass" ${canPass ? '' : 'disabled'}>${round === 1 ? 'Pass to program →' : 'Approve ✓'}</button></div>
        </div>
        ${round === 1 ? '<div style="margin-top:8px"><button class="linkbtn small" data-a="decline">Can\'t review this? Decline, and the lecturer will choose someone else</button></div>' : ''}
      </div>
      <div class="panel card">${renderPanel(s, round)}</div>
    </div>`;
}
function renderPanel(s, round) {
  const id = S.panel;
  if (!id) return `<div style="text-align:center;padding:20px 6px">${ART.review}<h3 style="margin-top:8px">Evidence appears here</h3><p class="small muted">Click <b>Open evidence</b> on any item. "Verified" unlocks once you've looked.</p></div>`;
  const k = rkey(s, round), ticks = S.rticks[k] || [];
  const compTable = `<table class="mini"><tr><th>From the uploaded score summary</th><th>%</th></tr>${COMPONENTS.map(c => `<tr><td>${c[0]}</td><td>${c[2]}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>100</b></td></tr></table>`;

      <div class="lookbox" style="margin:10px 0">

      <div class="small" style="margin-top:8px"><a href="#" onclick="return false">Open TQF3 for ${s.code} ↗</a></div>`;

      <table class="mini" style="margin-top:10px"><tr><th>Student ID</th><th>Total</th><th>Grade</th><th>Cutoff</th></tr><tr><td>6631402017</td><td><b>69.99</b></td><td>C+</td><td>B ≥ 70</td></tr></table>
      <p class="small muted">Is the reason acceptable under the course's TQF3 policy?</p>`;
  if (id === 'missing') return `<h3>Missing marks</h3><p class="small">Students with a blank component:</p><table class="mini"><tr><th>Student ID</th><th>Blank component</th><th>Grade</th></tr><tr><td>6631401012</td><td>Final</td><td>M</td></tr></table><p class="small muted">The lecturer says they told the students. You can ask for proof in a comment.</p>`;
  if (id === 'grade' || id === 'special') {

        <tr><td>6631401003</td><td>84.50</td><td>A</td></tr><tr><td>6631401008</td><td>71.25</td><td>B</td></tr>

/* ------------------------------------------------------------------ confirmation modal (press and hold) */
function renderModal() {
  const m = S.modal; if (!m) return '';
  const s = byId(m.sid);
  let art = ART.review, title = '', sub = '', rows = [], label = '';
  const r = (cls, icon, html) => `<div class="r ${cls}">${ic(icon)}<div>${html}</div></div>`;
  if (m.kind === 'submit') {
    const w = W(s), a = w.ans, gap = daysBetween(a.ann, a.dl);
    art = ART.review; title = 'Ready to submit?'; sub = `${s.code} · ${esc(s.name)}`; label = 'Hold to submit';
    rows = [r('good', 'check', `Grade report and score summary for <b>${s.students} students</b>`),
      r('good', 'percent', 'Two REG screenshots, checked by you: <b>all items Show, total 100%</b>'),
      r(w.c14 ? 'good' : 'warn', 'check', `Fixed: <b>F → M</b> for 2 students`),
      r(w.c13 === 'keep' ? 'warn' : 'good', 'alert', w.c13 === 'keep' ? `Kept <b>69.99 as C+</b>. Your reason will be highlighted for reviewers.` : 'Borderline total changed in REG'),
      r(gap >= 3 ? 'good' : 'warn', 'calendar', `Students had <b>${gap} days</b> to check their scores`),
      r(a.align === 'No' ? 'warn' : 'good', 'clipboard', a.align === 'No' ? `Differs from TQF3: "${esc(a.alignReason)}"` : 'Matches TQF3'),
      r('warn', 'doc', `<b>Bring ${paperNeeds(Object.assign({}, s, { mCount: w.c14 ? 2 : 0 })).length} paper documents</b> to the secretary`),
      r('good', 'user', `Buddy: <b>${esc(pname(w.buddy))}</b>`)];
  } else {
    const round = m.kind === 'pass' ? 1 : m.kind === 'approve' ? 2 : S.role === 'buddy' ? 1 : 2;
    const st = reviewStats(s, round), mine = st.mine;
    const counts = { v: 0, n: 0 }; Object.values(mine).forEach(x => { if (x.v === 'verified') counts.v++; if (x.v === 'na') counts.n++; });
    if (m.kind === 'return') {
      art = ART.returned; title = `Return to the lecturer with ${st.issues.length} issue${st.issues.length > 1 ? 's' : ''}?`; sub = `${s.code} · ${esc(lecNames(s))} will be emailed`; label = 'Hold to return';
      rows = st.issues.map(i => r('bad', 'x', `<b>${i.label}</b><br>"${esc(mine[i.id].note)}"`));
    } else {
      art = m.kind === 'approve' ? ART.approve : ART.review;
      title = m.kind === 'approve' ? 'Approve this section?' : 'Pass to the program?';
      sub = m.kind === 'approve' ? 'This is the last step in the system. Everything after it is manual.' : 'The SE program reviewer will check your work next.';
      label = m.kind === 'approve' ? 'Hold to approve' : 'Hold to pass';
      const seenN = Object.keys(S.seen[rkey(s, round)] || {}).length;
      rows = [r('good', 'eye', `You opened the evidence for <b>${seenN} items</b>`),
        parseFloat(S.gt[rkey(s, round)]) === 100 ? r('good', 'percent', 'REG 100%: you read Grand Total = <b>100</b> and ticked all 4 checks') : r('good', 'percent', 'REG 100% already verified in an earlier round'),
        r('good', 'dice', `Spot-check done: <b>${st.spot.label}</b>`),
        r('good', 'check', `<b>${counts.v}</b> verified · <b>${counts.n}</b> N/A · <b>0</b> issues`),
        s.ack ? r('warn', 'alert', `You accepted the lecturer's override: "${esc(s.ack)}"`) : '',
        r(paperDone(s) ? 'good' : 'warn', 'doc', paperDone(s) ? 'All paper documents received by the secretary' : 'Paper not all received yet')].filter(Boolean);
    }
  }
  return `<div class="modal-bg" data-a="mbg"><div class="modal" role="dialog" aria-modal="true">
    <div class="mh">${art}<div><h2>${title}</h2><div class="muted">${sub}</div></div></div>
    <div class="recap">${rows.join('')}</div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" data-a="mcancel">Go back</button>
      <button class="btn primary big hold" data-hold="1"><span class="fill"></span><span>${ic('hand')}</span><span>${label}</span></button>
    </div>
    <div class="hold-hint">Press and hold for about a second. This stops accidental clicks.</div>
  </div></div>`;
}

function bars(s) {
  const g = s.grades, keys = Object.keys(g), max = Math.max(...keys.map(k => g[k]));
  return `<div class="bars">${keys.map(k => `<div class="b" style="height:${(g[k] / max) * 100}%"><span>${g[k]}</span></div>`).join('')}</div>
    <div class="bars-l">${keys.map(k => `<div>${k}</div>`).join('')}</div>`;
}

/* ------------------------------------------------------------------ read-only view */
function renderView(s) {
  const items = itemsFor(s);
  const v = (x) => !x || !x.v ? '<span class="muted">—</span>' : x.v === 'verified' ? '<span class="chip approved">✓</span>' : x.v === 'issue' ? '<span class="chip err">✗ Issue</span>' : '<span class="chip muted">N/A</span>';
  const notMine = !s.lecturers.includes(me());
  return `${courseHead(s)}
    ${notMine && ['lecturer', 'buddy', 'program'].includes(S.role) ? '<div class="hint" style="margin-bottom:14px">👁 You\'re viewing a colleague\'s course. Everything is open to ADT lecturers. Only its lecturers, buddy and program reviewer can change it, but anyone can comment.</div>' : ''}
    ${s.status === 'notsub' ? `<div class="card"><h2>Not submitted yet</h2><p class="muted">The lecturer hasn't started the submission.</p></div>` : `
    <div class="grid3" style="margin-bottom:16px">
      <div class="card"><h3>Grades</h3>${bars(s)}</div>
      <div class="card"><h3>Evidence</h3><div class="stack small">${regBadge(s)}<div>${paperBadge(s)}</div>
        <div class="row"><img src="${s.shots.a}" style="width:48%;border:1px solid var(--line);border-radius:6px"><img src="${s.shots.b}" style="width:48%;border:1px solid var(--line);border-radius:6px"></div></div></div>
      <div class="card"><h3>History</h3><ul class="timeline">${s.history.map(h => `<li><span class="muted small">${h.t}</span> ${esc(h.x)}</li>`).join('')}</ul></div>
    </div>
    <div class="card" style="margin-bottom:16px"><h2>Checklist and reviews</h2><div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Item</th><th>Buddy${s.buddy ? ' · ' + esc(pname(s.buddy)) : ''}</th><th>Program</th></tr></thead>
      <tbody>${items.map(i => i.type === 'paper'
        ? `<tr><td class="small muted">${i.no}</td><td>${i.label}</td><td colspan="2" class="small">${paperStatusText(s, i).text}</td></tr>`
        : `<tr><td class="small muted">${i.no}</td><td>${i.label}<div class="small muted">${answerText(s, i)}</div></td><td>${v(s.bv[i.id])}</td><td>${v(s.pv[i.id])}</td></tr>`).join('')}</tbody>
    </table></div></div>`}
    <div class="card"><h2>Comments</h2>
      ${s.comments.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(pname(c.by))}</b> <span class="small muted">just now</span><div>${esc(c.text)}</div></div>`).join('') || '<p class="muted small">No comments yet.</p>'}
      <div class="row" style="margin-top:10px"><input type="text" class="grow" placeholder="Leave a comment for the lecturer (anyone in ADT can)" id="cmt"><button class="btn" data-a="comment" data-v="${s.id}">Post</button></div>
    </div>`;
}

/* ------------------------------------------------------------------ office */
function renderOffice() {
  const t = S.officeTab;
  const tabs = [['semester', 'Semester'], ['courses', 'Courses & final-exam flag'], ['pairs', 'Buddy pairings'], ['export', 'Export']];
  let body = '';
  if (t === 'semester') body = `
    <div class="grid2"><div class="stack">
      <h3>Semester 1/2569</h3>
      <label class="small">Lecturer submission deadline<br><input type="date" data-a="dl" data-k="submit" value="${S.deadlines.submit}"></label>
      <label class="small">Buddy review deadline<br><input type="date" data-a="dl" data-k="buddy" value="${S.deadlines.buddy}"></label>
      <label class="small">Program approval deadline<br><input type="date" data-a="dl" data-k="program" value="${S.deadlines.program}"></label>
      <div class="small muted">Reminders go out automatically at T-3 days, T-1 day and when overdue.</div>
    </div><div class="stack">
      <h3>Import</h3>
      <div class="file"><div class="ic">XLSX</div><div class="grow"><b>courses-1-2569.xlsx</b><div class="small muted">${S.sections.length} sections · 7 lecturers · imported 1 Nov</div></div><span class="chip approved">✓</span></div>
      <div class="file"><div class="ic">CSV</div><div class="grow"><b>reg-rosters-1-2569.csv</b><div class="small muted">536 enrollments · imported 1 Nov</div></div><span class="chip approved">✓</span></div>
      <button class="btn" data-a="noop">Import again…</button>
      <div class="hint">After program approval, the system is done. Anything after that is handled manually.</div>
    </div></div>`;
  if (t === 'courses') body = `
    <p class="sub">Set whether each section has a final exam. The M/I checks and the paper list depend on it.</p>
    <div class="tablewrap"><table><thead><tr><th>Course</th><th>Lecturer</th><th>Program</th><th>Has final exam</th><th>Status</th></tr></thead><tbody>
    ${S.sections.map(s => `<tr><td><b>${s.code}</b> <span class="small muted">${esc(s.name)}</span></td><td class="small">${esc(lecNames(s))}</td><td>${s.program}</td>
      <td><button class="toggle ${s.hasFinal ? 'on' : ''}" data-a="final" data-v="${s.id}" aria-label="has final exam"></button></td><td>${chip(s.status)}</td></tr>`).join('')}
    </tbody></table></div>`;
  if (t === 'pairs') body = `
    <p class="sub">Lecturers choose their own buddy when they submit. You only step in if someone is unavailable.</p>
    <div class="tablewrap"><table><thead><tr><th>Course</th><th>Lecturer</th><th>Buddy</th><th>Status</th><th>Reassign</th></tr></thead><tbody>
    ${S.sections.filter(s => s.buddy).map(s => `<tr><td><b>${s.code}</b></td><td class="small">${esc(lecNames(s))}</td><td class="small">${esc(pname(s.buddy))} <span class="muted">(${waitingFor(s.buddy)} waiting)</span></td><td>${chip(s.status)}</td>
      <td>${s.status === 'buddy' ? `<select data-a="reassign" data-v="${s.id}">${Object.entries(PEOPLE).filter(([id, p]) => p.program && !s.lecturers.includes(id)).map(([id, p]) => `<option value="${id}" ${id === s.buddy ? 'selected' : ''}>${p.name}</option>`).join('')}</select>` : '<span class="small muted">—</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
  if (t === 'export') {
    const ap = S.sections.filter(s => s.status === 'approved');
    body = `<div class="grid2">
      <div class="card"><h3>Approved sections</h3><p class="small muted">${ap.length} approved. Use this list for the manual steps after approval.</p><button class="btn primary" data-a="export" data-v="approved">Download approved list (.xlsx)</button></div>
      <div class="card"><h3>Completion report</h3><p class="small muted">Every section with its status, paper and REG evidence.</p><button class="btn" data-a="export" data-v="completion">Download completion report (.xlsx)</button></div>
      <div class="card"><h3>Old-form layout</h3><p class="small muted">The checklist in the same columns as the old Google Form response sheet.</p><button class="btn" data-a="export" data-v="legacy">Download (.xlsx)</button></div>
    </div>`;
  }
  return `<h1>Office</h1><p class="sub">Semester setup, course flags, buddy pairings and exports.</p>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${k === t ? 'on' : ''}" data-a="otab" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="card">${body}</div>
    <p style="margin-top:16px"><button class="btn" data-a="officelist">View all courses →</button></p>`;
}

/* ------------------------------------------------------------------ render */
function render() {
  renderTop();
  const app = document.getElementById('app');
  if (S.view === 'course') app.innerHTML = renderCourse();
  else if (S.role === 'office' && S.view !== 'olist') app.innerHTML = renderOffice();
  else app.innerHTML = renderList();
  app.insertAdjacentHTML('beforeend', renderModal());
  if (S.zoom) app.insertAdjacentHTML('beforeend', `<div class="lightbox" data-a="unzoom"><div class="cap">Click anywhere or press Esc to close</div><img src="${S.zoom}" alt=""></div>`);
  bindDrop();
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' && el.type !== 'checkbox' || el.tagName === 'SELECT') return;
  const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k;
  const s = S.id ? byId(S.id) : null;
  if (el.closest('tr.clickable') && e.target.closest('button') && a === 'open' && el.tagName !== 'BUTTON') return;
  switch (a) {
    case 'home': go(S.role === 'office' ? 'office' : 'list'); break;
    case 'role': S.role = v; S.filter = null; S.q = ''; go(v === 'office' ? 'office' : 'list'); break;
    case 'reset': reset(); render(); toast('Demo reset'); break;
    case 'filter': S.filter = v; render(); break;
    case 'open': e.stopPropagation(); go('course', v); break;
    case 'officelist': S.view = 'olist'; render(); break;
    case 'otab': S.officeTab = v; render(); break;
    // wizard
    case 'wnext': {
      const w = W(s);
      if (w.step < 5) { w.step++; render(); window.scrollTo(0, 0); }
      else { S.modal = { kind: 'submit', sid: s.id }; render(); }
      break;
    }
    case 'wback': W(s).step--; render(); break;
    case 'samplefiles': Object.assign(W(s).files, { grade: `grade-report-${s.code}.xlsx`, summary: `grade-entry-${s.code}.xlsx` }); render(); break;
    case 'rmfile': delete W(s).files[v]; render(); break;
    case 'box': S.activeBox = v; render(); document.querySelector(`.paste[data-v="${v}"]`)?.focus(); break;
    case 'sampleshot': W(s).shots[v] = v === 'a' ? SHOT_A : SHOT_B; S.activeBox = v === 'a' ? 'b' : 'a'; render(); break;
    case 'clearshot': delete W(s).shots[v]; W(s).shotChecks[v] = []; S.activeBox = v; render(); break;
    case 'shotcheck': W(s).shotChecks[k][+v] = el.checked; render(); break;
    case 'declare': W(s).declare = el.checked; render(); break;
    case 'fix14': W(s).c14 = true; toast('New grade report read: 2 × M'); render(); break;
    case 'c13': W(s).c13 = v; render(); break;
    case 'ans': W(s).ans[k] = v; render(); break;
    // lecturer returned
    case 'fixissue': s.issues.find(i => i.id == v).open = false; toast('New file uploaded. The item will be re-checked.'); render(); break;
    case 'replyissue': { const i = s.issues.find(i => i.id == v); i.open = false; i.reply = true; toast('Explanation added for the reviewer'); render(); break; }
    case 'resubmit': {
      const r = s.returnedBy;
      s.issues.forEach(i => { if (r === 1) delete s.bv[i.item]; else delete s.pv[i.item]; });
      s.status = r === 1 ? 'buddy' : 'program';
      s.history.push({ t: 'today', x: `Resubmitted: back to the ${r === 1 ? 'buddy' : 'program'} for the changed items` });
      toast(`Resubmitted: back to the ${r === 1 ? 'buddy' : 'program'}`); go('list'); break;
    }
    // review
    case 'verdict': {
      if (el.disabled) break;
      const round = S.role === 'buddy' ? 1 : 2, m = round === 1 ? s.bv : s.pv;
      const prev = m[k] || {};
      m[k] = { v, note: v === 'issue' ? prev.note || '' : '', auto: false };
      render();
      if (v === 'issue') document.querySelector(`input[data-a="note"][data-k="${k}"]`)?.focus();
      break;
    }
    case 'panel': { const round = S.role === 'buddy' ? 1 : 2, key = rkey(s, round); (S.seen[key] = S.seen[key] || {})[v] = true; S.panel = v; render();
      if (window.innerWidth < 980) document.querySelector('.panel')?.scrollIntoView({ behavior: 'smooth' }); break; }
    case 'rtick': { const key = rkey(s, S.role === 'buddy' ? 1 : 2); (S.rticks[key] = S.rticks[key] || [])[+v] = el.checked; render(); break; }
    case 'showauto': { const key = rkey(s, S.role === 'buddy' ? 1 : 2); S.showAuto[key] = !S.showAuto[key]; render(); break; }
    case 'flag': { const m = S.role === 'buddy' ? s.bv : s.pv; m[v] = { v: 'issue', note: '', auto: false }; render(); document.querySelector(`input[data-a="note"][data-k="${v}"]`)?.focus(); break; }
    case 'unflag': { const m = S.role === 'buddy' ? s.bv : s.pv; if (S.role === 'buddy') m[v] = { v: 'verified', auto: true }; else delete m[v]; render(); break; }
    case 'confirmrest': { const st = reviewStats(s, 2); st.autos.forEach(i => { if (!s.pv[i.id] || s.pv[i.id].auto) s.pv[i.id] = { v: 'verified', auto: true }; }); render(); toast('Pre-checked items confirmed'); break; }
    case 'mcancel': S.modal = null; render(); break;
    case 'zoom': e.stopPropagation(); S.zoom = el.getAttribute('src'); render(); break;
    case 'unzoom': S.zoom = null; render(); break;
    case 'noop2': break;
    case 'mbg': if (e.target === el) { S.modal = null; render(); } break;
    case 'confirmauto': {
      ITEMS.filter(i => i.type === 'auto').forEach(i => { if ((s.bv[i.id] || {}).v === 'verified') s.pv[i.id] = { v: 'verified', auto: true }; });
      render(); toast('Auto-checked items confirmed. The judgment items are still yours to decide.'); break;
    }
    case 'pass': S.modal = { kind: S.role === 'buddy' ? 'pass' : 'approve', sid: s.id }; render(); break;
    case 'return': S.modal = { kind: 'return', sid: s.id }; render(); break;
    case '__pass': {
      if (S.role === 'buddy') {
        s.status = 'program'; s.history.push({ t: 'today', x: `${pname(me())} verified every item and passed it to the program` });
        toast('Passed to the program reviewer'); go('list');
      } else {
        s.status = 'approved'; s.history.push({ t: 'today', x: `Approved by ${pname(me())}. The system's part is done.` });
        toast('Approved ✓. The rest continues manually, outside the system.'); go('list');
      }
      break;
    }
    case '__return': {
      const round = S.role === 'buddy' ? 1 : 2, m = round === 1 ? s.bv : s.pv;
      s.issues = Object.entries(m).filter(([, x]) => x.v === 'issue').map(([item, x], n) => ({ id: n + 1, round, by: me(), item, text: x.note, open: true }));
      s.status = 'returned'; s.returnedBy = round;
      s.history.push({ t: 'today', x: `Returned by ${round === 1 ? 'buddy' : 'program'} (${s.issues.length} issue${s.issues.length > 1 ? 's' : ''})` });
      toast('Returned to the lecturer with your issues'); go('list'); break;
    }
    case 'decline': s.status = 'notsub'; s.buddy = null; s.bv = {}; s.history.push({ t: 'today', x: 'Buddy declined. The lecturer will choose someone else.' }); toast('Declined. The lecturer has been told.'); go('list'); break;
    // view
    case 'comment': { const inp = document.getElementById('cmt'); if (inp.value.trim()) { s.comments.push({ by: me(), text: inp.value.trim() }); render(); } break; }
    // secretary
    case 'paper': { const x = byId(v); x.paper[k] = el.checked ? 'received' : 'awaiting'; render(); toast(el.checked ? 'Marked received' : 'Unmarked'); break; }
    case 'missing': { const x = byId(v); const n = paperNeeds(x).find(p => p.st !== 'received'); if (!n) { toast('Nothing is missing'); break; }
      if (n.k === 'absence') x.paper.absenceMissing = true; else x.paper[n.k] = 'missing';
      toast(`"${n.label}" marked missing. ${pname(x.lecturers[0])} has been emailed.`); render(); break; }
    // office
    case 'final': { const x = byId(v); x.hasFinal = !x.hasFinal; render(); break; }
    case 'export': toast('In the real system, this downloads an .xlsx file'); break;
    case 'noop': toast('In the real system, this opens a file picker'); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target, a = el.dataset.a, k = el.dataset.k, s = S.id ? byId(S.id) : null;
  if (a === 'q') { S.q = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-a="q"]'); n.focus(); n.setSelectionRange(pos, pos); }
  if (a === 'note') { (S.role === 'buddy' ? s.bv : s.pv)[k].note = el.value; const btn = document.querySelector('[data-a="return"]'); if (btn) { const m = S.role === 'buddy' ? s.bv : s.pv; btn.disabled = Object.values(m).some(x => x.v === 'issue' && !(x.note || '').trim()); } }
  if (a === 'c13reason') W(s).c13reason = el.value;
  if (a === 'alignReason') { W(s).ans.alignReason = el.value; }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.a, k = el.dataset.k, v = el.dataset.v, s = S.id ? byId(S.id) : null;
  if (a === 'date') { W(s).ans[k] = el.value; render(); }
  if (a === 'buddy') { W(s).buddy = el.value; render(); }
  if (a === 'alignReason') render();
  if (a === 'absence') { const x = byId(v); x.paper.absence = Math.max(0, Math.min(x.mCount, +el.value || 0)); x.paper.absenceMissing = false; render(); }
  if (a === 'dl') { S.deadlines[k] = el.value; toast('Deadline saved'); }
  if (a === 'reassign') { const x = byId(v); x.buddy = el.value; x.history.push({ t: 'today', x: `Office reassigned the buddy to ${pname(el.value)}` }); render(); toast('Buddy reassigned, and both lecturers told'); }
  if (el.id === 'filepick') addFiles(el.files);
});
let holdRaf = null;
function holdStart(btn) {
  const fill = btn.querySelector('.fill'), t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 1000); fill.style.width = (p * 100) + '%';
    if (p >= 1) { holdRaf = null; performModal(); } else holdRaf = requestAnimationFrame(step); };
  holdRaf = requestAnimationFrame(step);
}
function holdCancel() { if (holdRaf) { cancelAnimationFrame(holdRaf); holdRaf = null; } document.querySelectorAll('.hold .fill').forEach(f => f.style.width = '0'); }
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if (b) { e.preventDefault(); holdStart(b); } });
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => document.addEventListener(t, e => { if (holdRaf && (t !== 'pointerleave' || e.target.closest && e.target.closest('[data-hold]'))) holdCancel(); }, true));
document.addEventListener('keydown', e => { const b = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-hold]'); if (b && (e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); holdStart(b); } if (e.key === 'Escape' && (S.modal || S.zoom)) { if (S.zoom) S.zoom = null; else S.modal = null; render(); } });
document.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') holdCancel(); });
function performModal() {
  const m = S.modal; if (!m) return;
  const s = byId(m.sid); S.modal = null;
  if (m.kind === 'submit') return submit(s, W(s));
  const fake = { closest: () => null, dataset: { a: m.kind === 'return' ? '__return' : '__pass' }, tagName: 'DIV' };
  const btn = document.createElement('div'); btn.dataset.a = fake.dataset.a; btn.style.display = 'none'; document.body.appendChild(btn);
  btn.dispatchEvent(new MouseEvent('click', { bubbles: true })); btn.remove();
}
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.a !== 'gt') return;
  const s = byId(S.id), key = rkey(s, S.role === 'buddy' ? 1 : 2); S.gt[key] = el.value;
  const pos = el.selectionStart; render(); const n = document.querySelector('[data-a="gt"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
function submit(s, w) {
  s.status = 'buddy'; s.buddy = w.buddy; s.mCount = w.c14 ? 2 : 0;
  s.shots = { a: w.shots.a, b: w.shots.b };
  s.answers = Object.assign({}, w.ans);
  s.ack = w.c13 === 'keep' ? `Student 6631401033 has 69.99, just below B (70). Kept as C+. "${w.c13reason}"` : null;
  s.bv = autoOnly();
  s.grades = { A: 7, 'B+': 8, B: 10, 'C+': 9, C: 6, 'D+': 4, D: 2, F: 0, M: 2 };
  s.history.push({ t: 'today', x: `Submitted by ${pname(me())}, buddy: ${pname(w.buddy)}` });
  delete S.wiz[s.id];
  toast(`Submitted ✓. ${pname(w.buddy)} has been emailed.`);
  go('list');
}
function addFiles(files) {
  const s = byId(S.id), w = W(s);
  [...files].forEach(f => { const n = f.name; if (/grade|report|เกรด/i.test(n) && !w.files.grade) w.files.grade = n; else if (!w.files.summary) w.files.summary = n; else w.files.grade = w.files.grade || n; });
  render();
}
function bindDrop() {
  const d = document.getElementById('drop');
  if (d) {
    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
  }
  document.querySelectorAll('.paste').forEach(p => {
    p.addEventListener('dragover', e => e.preventDefault());
    p.addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); if (f) readImg(f, p.dataset.v); });
  });
}
function readImg(file, box) {
  const r = new FileReader();
  r.onload = () => { const s = byId(S.id); W(s).shots[box] = r.result; S.activeBox = box === 'a' ? 'b' : 'a'; render(); toast(`Screenshot ${box.toUpperCase()} attached`); };
  r.readAsDataURL(file);
}
document.addEventListener('paste', e => {
  if (S.view !== 'course' || !S.id) return;
  const s = byId(S.id); if (!S.wiz[s.id] || S.wiz[s.id].step !== 3) return;
  const item = [...(e.clipboardData || {}).items || []].find(i => i.type.startsWith('image/'));
  if (!item) { toast('No image on the clipboard. Snip with Windows + Shift + S first.'); return; }
  e.preventDefault();
  const w = W(s); const box = w.shots[S.activeBox] && !w.shots[S.activeBox === 'a' ? 'b' : 'a'] ? (S.activeBox === 'a' ? 'b' : 'a') : S.activeBox;
  readImg(item.getAsFile(), box);
});

render();
</script>
