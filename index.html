<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADT Grade Manager — PRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf8; --fg: #1f2328; --muted: #5d6470; --line: #e3e0da;
    --accent: #7a2e2e; --code: #f2efe9; --th: #f4f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e6e6e6; --muted: #9aa1ab; --line: #2e3238;
            --accent: #e0a0a0; --code: #22252b; --th: #1e2126; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.65 Inter, "IBM Plex Sans Thai", system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 48px;
          max-width: 1280px; margin: 0 auto; padding: 40px 24px; }
  nav { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px);
        overflow: auto; font-size: 14px; border-right: 1px solid var(--line); padding-right: 16px; }
  nav .title { font-weight: 700; margin-bottom: 12px; color: var(--accent); }
  nav a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0; }
  nav a.h3 { padding-left: 14px; font-size: 13px; }
  nav a:hover { color: var(--fg); }
  main { min-width: 0; max-width: 900px; }
  h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 16px; }
  h2 { font-size: 1.45rem; margin: 48px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  h3 { font-size: 1.12rem; margin: 32px 0 8px; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  pre { background: var(--code); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 16px 0; padding: 10px 16px; border-left: 4px solid var(--accent);
               background: var(--code); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 4px 0; }
  .table { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; vertical-align: top; text-align: left; }
  th { background: var(--th); font-weight: 600; }
  li { margin: 3px 0; }
  .loading { color: var(--muted); }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; gap: 16px; padding: 24px 16px; }
    nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line);
          padding: 0 0 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav id="toc"><div class="title">Contents</div></nav>
  <main id="content"><p class="loading">Loading PRD…</p></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  fetch('prd.md', { cache: 'no-cache' })
    .then(r => r.text())
    .then(md => {
      const main = document.getElementById('content');
      main.innerHTML = marked.parse(md, { gfm: true });
      main.querySelectorAll('table').forEach(t => {
        const w = document.createElement('div'); w.className = 'table';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
      const toc = document.getElementById('toc');
      main.querySelectorAll('h2, h3').forEach((h, i) => {
        h.id = h.id || 's' + i;
        const a = document.createElement('a');
        a.href = '#' + h.id; a.textContent = h.textContent;
        a.className = h.tagName.toLowerCase();
        toc.appendChild(a);
      });
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    })
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<p>Could not load <a href="prd.md">prd.md</a>.</p>';
    });
</script>
</body>
</html>
